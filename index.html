<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FOLK BookSync — Cloud Edition</title>
  <meta name="description" content="Cloud-powered real-time book distribution system for FOLK. Firebase Firestore backend with multi-device sync.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Firebase v10 Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --bg-dark:#070b14; --bg-card:rgba(15,23,42,0.9); --bg-input:rgba(10,16,30,0.95);
      --primary-amber:#f59e0b; --primary-saffron:#d97706; --primary-glow:rgba(245,158,11,0.25);
      --accent-blue:#3b82f6; --accent-indigo:#6366f1; --accent-emerald:#10b981;
      --accent-rose:#f43f5e; --accent-purple:#8b5cf6;
      --text-main:#f8fafc; --text-muted:#94a3b8; --text-dim:#64748b;
      --border-subtle:rgba(255,255,255,0.1); --border-highlight:rgba(245,158,11,0.4);
      --radius-sm:8px; --radius-md:14px; --radius-lg:20px;
      --shadow-main:0 10px 30px -10px rgba(0,0,0,0.6); --shadow-glow:0 0 20px rgba(245,158,11,0.15);
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',system-ui,sans-serif;background-color:var(--bg-dark);background-image:radial-gradient(at 10% 10%,rgba(245,158,11,0.08) 0px,transparent 50%),radial-gradient(at 90% 90%,rgba(99,102,241,0.08) 0px,transparent 50%);background-attachment:fixed;color:var(--text-main);min-height:100vh;line-height:1.5;}
    h1,h2,h3,h4,h5,h6{font-family:'Outfit',sans-serif;letter-spacing:-0.02em;}
    .app-container{display:flex;flex-direction:column;min-height:100vh;}
    /* Setup */
    .setup-wrapper{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;}
    .setup-card{background:rgba(15,23,42,0.95);border:1px solid var(--border-highlight);border-radius:var(--radius-lg);padding:2.5rem;width:100%;max-width:600px;box-shadow:0 20px 50px rgba(0,0,0,0.8),var(--shadow-glow);}
    .setup-logo{width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,#4285f4,#34a853);display:flex;align-items:center;justify-content:center;font-size:2.2rem;color:#fff;margin:0 auto 1.5rem;box-shadow:0 0 30px rgba(66,133,244,0.4);}
    .setup-card h2{text-align:center;font-size:1.8rem;background:linear-gradient(135deg,#fff 30%,var(--primary-amber));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem;}
    .setup-card>p{text-align:center;color:var(--text-muted);margin-bottom:1.5rem;font-size:.9rem;}
    .setup-steps{display:flex;flex-direction:column;gap:.75rem;margin-bottom:1.5rem;background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.15);padding:1.25rem;border-radius:var(--radius-md);}
    .setup-step{display:flex;gap:.75rem;align-items:flex-start;font-size:.88rem;color:var(--text-muted);}
    .step-num{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--primary-amber),var(--primary-saffron));color:#000;font-size:.75rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .setup-step a{color:var(--accent-blue);text-decoration:none;} .setup-step a:hover{text-decoration:underline;}
    .setup-step code{background:rgba(255,255,255,.1);padding:.1rem .4rem;border-radius:4px;font-size:.82rem;color:var(--accent-emerald);}
    /* Loading */
    .loading-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.25rem;}
    .loading-spinner{font-size:3.5rem;color:var(--primary-amber);animation:spin .8s linear infinite;}
    .loading-brand{font-family:'Outfit',sans-serif;font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,#fff 30%,var(--primary-amber));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .loading-msg{color:var(--text-muted);font-size:.9rem;}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.8)}}
    /* Login */
    .login-wrapper{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem;}
    .pw-input-wrap{position:relative;width:100%;}
    .pw-toggle{position:absolute;right:.8rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;padding:4px;}
    .pw-toggle:hover{color:var(--text-main);}
    .login-card{background:rgba(15,23,42,.95);border:1px solid var(--border-highlight);border-radius:var(--radius-lg);padding:2.5rem;width:100%;max-width:440px;box-shadow:0 20px 50px rgba(0,0,0,.8),var(--shadow-glow);}
    .login-header{text-align:center;margin-bottom:2rem;}
    .login-logo{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,var(--primary-amber),var(--primary-saffron));display:flex;align-items:center;justify-content:center;font-size:2rem;color:#fff;margin:0 auto 1rem;box-shadow:var(--shadow-glow);}
    .login-header h2{font-size:1.6rem;background:linear-gradient(135deg,#fff 30%,var(--primary-amber));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .login-header p{font-size:.85rem;color:var(--text-muted);margin-top:.4rem;}
    .cloud-badge{display:inline-flex;align-items:center;gap:.4rem;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);color:var(--accent-emerald);padding:.3rem .75rem;border-radius:50px;font-size:.75rem;font-weight:600;margin:.75rem auto 0;width:fit-content;}
    /* Navbar */
    .navbar{background:rgba(11,17,30,0.5);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,0.05);position:sticky;top:0;z-index:100;padding:.9rem 1.5rem;}
    .nav-content{max-width:1400px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;}
    .brand{display:flex;align-items:center;gap:.75rem;}
    .brand-icon{width:42px;height:42px;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--primary-amber),var(--primary-saffron));display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.3rem;box-shadow:var(--shadow-glow);}
    .brand-text h1{font-size:1.35rem;font-weight:700;background:linear-gradient(135deg,#fff 30%,var(--primary-amber));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .brand-text p{font-size:.75rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;}
    .sync-status{display:flex;align-items:center;gap:.4rem;font-size:.75rem;color:var(--accent-emerald);font-weight:600;margin-left:1rem;}
    .sync-dot{width:8px;height:8px;border-radius:50%;background:var(--accent-emerald);animation:pulse-dot 2s ease-in-out infinite;}
    .nav-actions{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;}
    .nav-btn{display:flex;align-items:center;gap:.5rem;padding:.55rem 1rem;border-radius:var(--radius-sm);font-size:.88rem;font-weight:600;cursor:pointer;transition:all .2s ease;border:1px solid transparent;}
    .btn-primary{background:linear-gradient(135deg,var(--primary-amber),var(--primary-saffron));color:#0d1322;box-shadow:0 4px 15px rgba(245,158,11,.3);}
    .btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(245,158,11,.45);}
    .btn-secondary{background:rgba(255,255,255,.06);color:var(--text-main);border:1px solid var(--border-subtle);}
    .btn-secondary:hover{background:rgba(255,255,255,.12);}
    .btn-emerald{background:linear-gradient(135deg,#10b981,#059669);color:#fff;}
    .btn-indigo{background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;}
    .btn-purple{background:linear-gradient(135deg,#8b5cf6,#7c3aed);color:#fff;}
    .btn-rose{background:linear-gradient(135deg,#f43f5e,#e11d48);color:#fff;}
    /* Tabs */
    .tabs-bar{background:rgba(13,19,33,0.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,0.05);padding:.5rem 1.5rem;}
    .tabs-container{max-width:1400px;margin:0 auto;display:flex;gap:.5rem;overflow-x:auto;}
    .tab-item{display:flex;align-items:center;gap:.5rem;padding:.65rem 1.25rem;border-radius:var(--radius-sm);font-size:.9rem;font-weight:500;color:var(--text-muted);background:transparent;border:1px solid transparent;cursor:pointer;transition:all .2s ease;white-space:nowrap;}
    .tab-item:hover{color:var(--text-main);background:rgba(255,255,255,.04);}
    .tab-item.active{color:var(--primary-amber);background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.3);font-weight:600;}
    /* Main */
    .main-content{max-width:1400px;margin:0 auto;padding:1.5rem;width:100%;flex:1;}
    .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.25rem;margin-bottom:1.5rem;}
    .stat-card{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:1.25rem;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;}
    .stat-card.amber::before,.stat-card.blue::before,.stat-card.emerald::before,.stat-card.purple::before{content:'';position:absolute;top:0;left:0;width:100%;height:3px;}
    .stat-card.amber::before{background:var(--primary-amber);}
    .stat-card.blue::before{background:var(--accent-blue);}
    .stat-card.emerald::before{background:var(--accent-emerald);}
    .stat-card.purple::before{background:var(--accent-purple);}
    .stat-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.75rem;}
    .stat-title{font-size:.82rem;color:var(--text-muted);text-transform:uppercase;font-weight:600;}
    .stat-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;}
    .stat-icon.amber{background:rgba(245,158,11,.15);color:var(--primary-amber);}
    .stat-icon.blue{background:rgba(59,130,246,.15);color:var(--accent-blue);}
    .stat-icon.emerald{background:rgba(16,185,129,.15);color:var(--accent-emerald);}
    .stat-icon.purple{background:rgba(139,92,246,.15);color:var(--accent-purple);}
    .stat-value{font-size:1.85rem;font-weight:700;color:var(--text-main);font-family:'Outfit',sans-serif;}
    .stat-sub{font-size:.78rem;color:var(--text-dim);margin-top:.4rem;}
    .glass-panel{background:rgba(15,23,42,0.5);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.08);border-top:1px solid rgba(255,255,255,0.15);border-left:1px solid rgba(255,255,255,0.12);border-radius:var(--radius-lg);padding:1.5rem;margin-bottom:1.5rem;box-shadow:0 8px 32px 0 rgba(0,0,0,0.37);}
    .panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;flex-wrap:wrap;gap:1rem;}
    .panel-title{font-size:1.2rem;font-weight:600;display:flex;align-items:center;gap:.6rem;}
    .section-search-bar{display:flex;gap:1rem;align-items:center;margin-bottom:1.25rem;background:rgba(10,16,30,.6);padding:.75rem 1rem;border-radius:var(--radius-sm);border:1px solid var(--border-subtle);}
    .section-search-input-wrap{position:relative;flex:1;}
    .section-search-input-wrap i{position:absolute;left:.9rem;top:50%;transform:translateY(-50%);color:var(--primary-amber);}
    .section-search-input{width:100%;padding:.6rem 1rem .6rem 2.4rem;background:var(--bg-input);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);color:#fff;font-size:.9rem;outline:none;}
    .section-search-input:focus{border-color:var(--primary-amber);}
    .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;}
    .form-group{display:flex;flex-direction:column;gap:.4rem;}
    .form-group label{font-size:.82rem;font-weight:600;color:var(--text-muted);}
    .form-control{width:100%;padding:.65rem .9rem;background:var(--bg-input);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);color:var(--text-main);font-size:.92rem;font-family:inherit;outline:none;}
    .form-control:focus{border-color:var(--primary-amber);}
    .table-responsive{width:100%;overflow-x:auto;border-radius:var(--radius-sm);border:1px solid var(--border-subtle);}
    .custom-table{width:100%;border-collapse:collapse;text-align:left;font-size:.88rem;}
    .custom-table th{background:rgba(15,23,42,.95);padding:.85rem 1rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;font-size:.75rem;border-bottom:1px solid var(--border-subtle);white-space:nowrap;}
    .custom-table td{padding:.9rem 1rem;border-bottom:1px solid rgba(255,255,255,.04);}
    .custom-table tbody tr:hover{background:rgba(255,255,255,.03);}
    .badge{display:inline-flex;align-items:center;gap:.35rem;padding:.25rem .65rem;border-radius:50px;font-size:.75rem;font-weight:600;}
    .badge-amber{background:rgba(245,158,11,.15);color:var(--primary-amber);border:1px solid rgba(245,158,11,.3);}
    .badge-emerald{background:rgba(16,185,129,.15);color:var(--accent-emerald);border:1px solid rgba(16,185,129,.3);}
    .badge-blue{background:rgba(59,130,246,.15);color:var(--accent-blue);border:1px solid rgba(59,130,246,.3);}
    .badge-purple{background:rgba(139,92,246,.15);color:var(--accent-purple);border:1px solid rgba(139,92,246,.3);}
    .badge-rose{background:rgba(244,63,94,.15);color:var(--accent-rose);border:1px solid rgba(244,63,94,.3);}
    .modal-overlay{position:fixed;inset:0;background:rgba(5,8,15,.75);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem;}
    .modal-card{background:rgba(15,23,42,0.65);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,0.1);border-top:1px solid rgba(255,255,255,0.15);border-radius:var(--radius-lg);width:100%;max-width:850px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.8),0 0 30px rgba(245,158,11,0.08);}
    .modal-header{padding:1.2rem 1.5rem;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;justify-content:space-between;align-items:center;}
    .close-btn{background:transparent;border:none;color:var(--text-muted);font-size:1.2rem;cursor:pointer;}
    .modal-body{padding:1.5rem;display:flex;flex-direction:column;gap:1.2rem;max-height:75vh;overflow-y:auto;}
    .modal-footer{padding:1rem 1.5rem;border-top:1px solid var(--border-subtle);display:flex;justify-content:flex-end;gap:.75rem;}
    .multi-item-table{width:100%;border-collapse:collapse;margin-top:.5rem;}
    .multi-item-table th{font-size:.75rem;text-transform:uppercase;color:var(--text-muted);padding:.5rem;text-align:left;border-bottom:1px solid var(--border-subtle);}
    .multi-item-table td{padding:.5rem;}
    .error-banner{background:rgba(244,63,94,.15);border:1px solid rgba(244,63,94,.4);color:var(--accent-rose);padding:.85rem 1.1rem;border-radius:var(--radius-sm);font-size:.88rem;display:flex;align-items:center;gap:.6rem;margin-bottom:.75rem;}
    /* Mobile Smartphone Optimization */
    @media (max-width: 768px) {
      body { font-size: 14px; }
      .navbar { padding: .75rem 1rem; }
      .nav-content { flex-direction: column; align-items: stretch; gap: .75rem; }
      .brand { justify-content: space-between; width: 100%; }
      .brand-text h1 { font-size: 1.1rem; }
      .brand-text p { font-size: .65rem; }
      .nav-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: .4rem; width: 100%; }
      .nav-btn { justify-content: center; padding: .55rem .3rem; font-size: .75rem; gap: .3rem; text-align: center; white-space: nowrap; }
      .nav-btn i { font-size: .85rem; }
      
      .tabs-bar { padding: .4rem .75rem; }
      .tabs-container { gap: .35rem; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
      .tabs-container::-webkit-scrollbar { display: none; }
      .tab-item { padding: .5rem .75rem; font-size: .78rem; }

      .main-content { padding: .75rem; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); gap: .6rem; }
      .stat-card { padding: .85rem; }
      .stat-value { font-size: 1.3rem; }
      .stat-sub { font-size: .68rem; }
      .stat-icon { width: 30px; height: 30px; font-size: .9rem; }

      .glass-panel { padding: .9rem; margin-bottom: 1rem; }
      .panel-header { flex-direction: column; align-items: flex-start; gap: .6rem; }
      .panel-title { font-size: 1rem; }

      .section-search-bar { flex-direction: column; align-items: stretch; gap: .5rem; padding: .6rem; }

      .setup-wrapper, .login-wrapper { padding: .85rem; }
      .setup-card, .login-card { padding: 1.25rem; border-radius: var(--radius-md); }
      .login-header h2, .setup-card h2 { font-size: 1.35rem; }

      .modal-overlay { padding: .4rem; align-items: flex-end; }
      .modal-card { max-height: 92vh; margin: 0; width: 100%; border-radius: var(--radius-md) var(--radius-md) 0 0; }
      .modal-header { padding: .85rem 1rem; }
      .modal-body { padding: .9rem; gap: .85rem; max-height: 72vh; }
      .modal-footer { padding: .75rem 1rem; flex-wrap: wrap; }
      .modal-footer .nav-btn { flex: 1; }

      /* Touch targets & input font size fix for mobile zoom */
      .form-control, .section-search-input { font-size: 16px !important; padding: .55rem .7rem; }
      .form-grid { grid-template-columns: 1fr; gap: .75rem; }

      .multi-item-table th, .multi-item-table td { padding: .3rem .2rem; font-size: .75rem; }
      .multi-item-table select, .multi-item-table input { font-size: 14px !important; padding: .4rem .2rem; }

      .custom-table th { padding: .6rem .75rem; font-size: .68rem; }
      .custom-table td { padding: .7rem; font-size: .78rem; }
    }

    @media (max-width: 480px) {
      .nav-actions { grid-template-columns: repeat(2, 1fr); }
      .stats-grid { grid-template-columns: 1fr 1fr; }
    }

    @media print{body{background:#fff!important;color:#000!important;}.navbar,.tabs-bar,.nav-actions,.section-search-bar,.modal-overlay,.no-print{display:none!important;}.glass-panel,.stat-card{background:#fff!important;border:1px solid #ccc!important;color:#000!important;}.custom-table{color:#000!important;}.custom-table th{background:#f0f0f0!important;color:#000!important;}}
  </style>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const fmt = (n) => new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(Number(n)||0);
const fmtDate = (s) => { if(!s)return'-'; try{const d=new Date(s);return isNaN(d)?s:d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});}catch{return s;} };

const generateNextId = (type, vouchers, idField) => {
  const d = new Date();
  const yy = String(d.getFullYear()).slice(2);
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  const prefix = `${type}-${yy}-${mm}${dd}-`;
  let maxSeq = 0;
  (vouchers || []).forEach(v => {
    const id = v[idField];
    if (typeof id === 'string' && id.startsWith(prefix)) {
      const seq = parseInt(id.split('-').pop(), 10);
      if (!isNaN(seq) && seq > maxSeq) maxSeq = seq;
    } else if (typeof id === 'number') {
      const strId = String(id);
      if (strId.startsWith(prefix)) {
        const seq = parseInt(strId.split('-').pop(), 10);
        if (!isNaN(seq) && seq > maxSeq) maxSeq = seq;
      }
    }
  });
  return prefix + String(maxSeq + 1).padStart(2, '0');
};

const CATALOG = [
  {id:'b1',name:'Bhagavad Gita As It Is',category:'Major Work',defaultPrice:250},
  {id:'b2',name:'Srimad Bhagavatam (Cantos 1-12)',category:'Multi-Volume',defaultPrice:600},
  {id:'b3',name:'Sri Chaitanya Charitamrita',category:'Multi-Volume',defaultPrice:500},
  {id:'b4',name:'Krsna - The Supreme Personality of Godhead',category:'Major Work',defaultPrice:350},
  {id:'b5',name:'The Nectar of Devotion',category:'Major Work',defaultPrice:200},
  {id:'b6',name:'Teachings of Lord Chaitanya',category:'Major Work',defaultPrice:200},
  {id:'b7',name:'Science of Self Realization',category:'Medium Book',defaultPrice:150},
  {id:'b8',name:'Beyond Birth & Death',category:'Small Book',defaultPrice:40},
  {id:'b9',name:'Perfection of Yoga',category:'Small Book',defaultPrice:40},
  {id:'b10',name:'Raja Vidya - King of Knowledge',category:'Small Book',defaultPrice:40},
  {id:'b11',name:'Easy Journey to Other Planets',category:'Small Book',defaultPrice:40},
  {id:'b12',name:'Elevation to Krsna Consciousness',category:'Small Book',defaultPrice:40},

// ── Firebase Setup Screen ──────────────────────────────────────
function SetupScreen({ onSave }) {
  const [txt, setTxt] = useState('');
  const [err, setErr] = useState('');

  const connect = () => {
    if (!txt.trim()) { setErr('Please paste your Firebase config.'); return; }
    try {
      let t = txt.trim();
      const m = t.match(/const\s+\w+\s*=\s*(\{[\s\S]*?\})\s*;?/);
      if (m) t = m[1];
      t = t.replace(/([{,]\s*)([a-zA-Z0-9_]+)\s*:/g, '$1"$2":').replace(/,\s*([}\]])/g,'$1');
      const cfg = JSON.parse(t);
      if (!cfg.apiKey || !cfg.projectId) { setErr('Invalid config — must have apiKey and projectId.'); return; }
      onSave(cfg);
    } catch(e) { setErr('Could not parse config. Paste the exact JSON from Firebase Console.'); }
  };

  return (
    <div className="setup-wrapper">
      <div className="setup-card">
        <div className="setup-logo"><i className="fa-brands fa-google"></i></div>
        <h2>Connect Firebase Database</h2>
        <p>One-time setup — your data will sync across all devices in real time.</p>
        <div className="setup-steps">
          <div className="setup-step"><div className="step-num">1</div><div>Go to <a href="https://console.firebase.google.com" target="_blank">console.firebase.google.com</a> → <b>Add Project</b> → name it <b>folk-booksync</b></div></div>
          <div className="setup-step"><div className="step-num">2</div><div>Left sidebar → <b>Firestore Database</b> → <b>Create Database</b> → Production Mode → any region → Enable</div></div>
          <div className="setup-step"><div className="step-num">3</div><div>Firestore → <b>Rules</b> tab → replace entire content with <code>rules_version='2'; service cloud.firestore &#123; match /databases/&#123;database&#125;/documents &#123; match /&#123;document=**&#125; &#123; allow read, write: if true; &#125; &#125; &#125;</code> → Publish</div></div>
          <div className="setup-step"><div className="step-num">4</div><div>⚙️ <b>Project Settings</b> → <b>Your Apps</b> → <b>&lt;/&gt; Web</b> → Register app → copy the <b>firebaseConfig</b> object</div></div>
          <div className="setup-step"><div className="step-num">5</div><div>Paste the config below and click Connect</div></div>
        </div>
        <div className="form-group" style={{marginBottom:'1rem'}}>
          <label>Firebase Config (paste the JSON object here)</label>
          <textarea className="form-control" rows="8" value={txt} onChange={e=>{setTxt(e.target.value);setErr('');}} placeholder={'{\n  "apiKey": "AIzaSy...",\n  "authDomain": "folk-booksync.firebaseapp.com",\n  "projectId": "folk-booksync",\n  "storageBucket": "folk-booksync.appspot.com",\n  "messagingSenderId": "12345",\n  "appId": "1:12345:web:abc"\n}'} style={{fontFamily:'monospace',fontSize:'.82rem',resize:'vertical'}} />
        </div>
        {err && <div className="error-banner"><i className="fa-solid fa-triangle-exclamation"></i>{err}</div>}
        <button className="nav-btn btn-primary" style={{width:'100%',justifyContent:'center',padding:'.9rem',fontSize:'1rem',marginTop:'.5rem'}} onClick={connect}>
          <i className="fa-brands fa-google"></i> Connect to Firebase & Launch App
        </button>
        <div style={{textAlign:'center',marginTop:'1rem',fontSize:'.75rem',color:'var(--text-dim)'}}>🔒 Config saved in your browser only. All data goes to Firestore.</div>
      </div>
    </div>
  );
}

// ── Auth Screen (Login / Sign Up / Forgot Password) ────────────
function AuthScreen({ db, onLoginSuccess }) {
  const [mode, setMode] = useState('login'); // 'login' | 'signup' | 'forgot'
  const [u, setU] = useState('');
  const [p, setP] = useState('');
  const [cp, setCp] = useState('');
  const [sq, setSq] = useState('What is Srila Prabhupada\'s first book?');
  const [sa, setSa] = useState('');
  const [newP, setNewP] = useState('');
  const [err, setErr] = useState('');
  const [forgotStep, setForgotStep] = useState(1);
  const [recoveryUserDoc, setRecoveryUserDoc] = useState(null);
  const [showP, setShowP] = useState(false);

  const cleanKey = (str) => str.trim().toLowerCase().replace(/[^a-z0-9_]/g, '_');

  // Handle Login Submission
  const handleLoginSubmit = async (e) => {
    e.preventDefault();
    setErr('');
    const key = cleanKey(u);
    if (!key || !p.trim()) { setErr('Enter username and password.'); return; }

    // Super Admin Master Credentials
    if (key === 'admin' && p === 'admin123') {
      onLoginSuccess({ username: 'Master Admin', tenantKey: 'folk', role: 'admin' });
      return;
    }

    try {
      // Check if user exists in Firestore 'users'
      const userSnap = await db.collection('users').doc(key).get();
      if (!userSnap.exists) {
        // Fallback check for default 'folk' account
        if (key === 'folk' && p === 'admin123') {
          onLoginSuccess({ username: 'folk', tenantKey: 'folk', role: 'user' });
          return;
        }
        setErr(`❌ Account "${u.trim()}" does NOT exist! Please click "Sign Up" above to create your account.`);
        return;
      }
      const data = userSnap.data();
      if (data.password !== p) {
        setErr('❌ Incorrect password! Please try again or use "Forgot Password".');
        return;
      }
      onLoginSuccess({ username: data.username || u.trim(), tenantKey: key, role: data.role || 'user' });
    } catch (e) {
      setErr('Login failed: ' + e.message);
    }
  };

  // Handle Sign Up Submission (Prevents duplicate usernames)
  const handleSignUpSubmit = async (e) => {
    e.preventDefault();
    setErr('');
    const key = cleanKey(u);
    if (!key || !p.trim() || !cp.trim() || !sa.trim()) { setErr('Please fill in all required fields.'); return; }
    if (p !== cp) { setErr('Passwords do not match!'); return; }
    if (key === 'admin') { setErr('Username "admin" is reserved for Master Admin.'); return; }

    try {
      const userSnap = await db.collection('users').doc(key).get();
      if (userSnap.exists) {
        setErr(`⚠️ WARNING: Username "${u.trim()}" is ALREADY TAKEN! Please choose a different username.`);
        return;
      }

      const newUserObj = {
        username: u.trim(),
        tenantKey: key,
        password: p,
        deletePin: p,
        securityQuestion: sq,
        securityAnswer: sa.trim().toLowerCase(),
        role: 'user',
        createdAt: new Date().toISOString()
      };

      await db.collection('users').doc(key).set(newUserObj);
      await db.collection('tenants').doc(key).collection('settings').doc('credentials').set({ username: u.trim(), password: p, deletePin: p });
      
      alert(`🎉 Account "${u.trim()}" created successfully! Your personal workspace is ready.`);
      onLoginSuccess({ username: u.trim(), tenantKey: key, role: 'user' });
    } catch (e) {
      setErr('Sign Up failed: ' + e.message);
    }
  };

  // Handle Forgot Password - Step 1: Find Account
  const handleForgotCheckUser = async (e) => {
    e.preventDefault();
    setErr('');
    const key = cleanKey(u);
    if (!key) { setErr('Enter your username.'); return; }
    try {
      const snap = await db.collection('users').doc(key).get();
      if (!snap.exists) {
        setErr(`Account "${u.trim()}" was not found.`);
        return;
      }
      setRecoveryUserDoc(snap.data());
      setForgotStep(2);
    } catch (e) {
      setErr('Account lookup failed: ' + e.message);
    }
  };

  // Handle Forgot Password - Step 2: Reset Password
  const handleResetPassword = async (e) => {
    e.preventDefault();
    setErr('');
    if (!sa.trim() || !newP.trim()) { setErr('Fill in security answer and new password.'); return; }
    if (sa.trim().toLowerCase() !== recoveryUserDoc.securityAnswer.toLowerCase()) {
      setErr('❌ Incorrect Security Answer! Verification failed.');
      return;
    }
    try {
      const key = recoveryUserDoc.tenantKey;
      await db.collection('users').doc(key).update({ password: newP.trim(), deletePin: newP.trim() });
      await db.collection('tenants').doc(key).collection('settings').doc('credentials').set({ username: recoveryUserDoc.username, password: newP.trim(), deletePin: newP.trim() }, { merge: true });
      alert('🔒 Password reset successfully! Logging you in...');
      onLoginSuccess({ username: recoveryUserDoc.username, tenantKey: key, role: recoveryUserDoc.role || 'user' });
    } catch (e) {
      setErr('Password reset failed: ' + e.message);
    }
  };

  return (
    <div className="login-wrapper">
      <div className="login-card" style={{ maxWidth: mode === 'signup' ? '480px' : '440px' }}>
        <div className="login-header">
          <img src="folk_logo.png" alt="FOLK Life" style={{ width: '72px', height: '72px', borderRadius: '50%', objectFit: 'cover', margin: '0 auto 1rem', display: 'block', boxShadow: '0 0 30px rgba(245,158,11,0.4)' }} />
          <h2>FOLK BookSync</h2>
          <p>ISKCON Bhadaj, Ahmedabad — Book Distribution Portal</p>
          <div style={{ display: 'flex', gap: '.5rem', justifyContent: 'center', marginTop: '1rem' }}>
            <button type="button" className={`nav-btn ${mode==='login'?'btn-primary':'btn-secondary'}`} style={{ padding: '.4rem 1.25rem', fontSize: '.85rem' }} onClick={() => { setMode('login'); setErr(''); }}>Login</button>
            <button type="button" className={`nav-btn ${mode==='signup'?'btn-primary':'btn-secondary'}`} style={{ padding: '.4rem 1.25rem', fontSize: '.85rem' }} onClick={() => { setMode('signup'); setErr(''); }}>Sign Up</button>
          </div>
        </div>

        {err && <div className="error-banner" style={{ marginBottom: '1rem' }}><i className="fa-solid fa-triangle-exclamation"></i><span>{err}</span></div>}

        {mode === 'login' && (
          <form onSubmit={handleLoginSubmit}>
            <div className="form-group" style={{ marginBottom: '1rem' }}>
              <label>Username *</label>
              <input type="text" className="form-control" placeholder="Enter your username" value={u} onChange={e=>setU(e.target.value)} required />
            </div>
            <div className="form-group" style={{ marginBottom: '1.2rem' }}>
              <label>Password *</label>
              <div className="pw-input-wrap">
                <input type={showP ? "text" : "password"} className="form-control" placeholder="Enter password" value={p} onChange={e=>setP(e.target.value)} required style={{ paddingRight: '2.5rem' }} />
                <button type="button" className="pw-toggle" onClick={() => setShowP(!showP)} tabIndex="-1">
                  <i className={`fa-regular ${showP ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                </button>
              </div>
              <div style={{ textAlign: 'right', marginTop: '.35rem' }}>
                <button type="button" style={{ background: 'none', border: 'none', color: 'var(--accent-blue)', fontSize: '.78rem', cursor: 'pointer', textDecoration: 'underline', padding: 0 }} onClick={() => { setMode('forgot'); setErr(''); setForgotStep(1); }}>
                  Forgot Password?
                </button>
              </div>
            </div>
            <button type="submit" className="nav-btn btn-primary" style={{ width: '100%', justifyContent: 'center', padding: '.8rem', fontSize: '1rem' }}>
              <i className="fa-solid fa-right-to-bracket"></i> Login to Portal
            </button>
          </form>
        )}

        {mode === 'signup' && (
          <form onSubmit={handleSignUpSubmit}>
            <div className="form-group" style={{ marginBottom: '.75rem' }}>
              <label>Choose Username *</label>
              <input type="text" className="form-control" placeholder="Unique username" value={u} onChange={e=>setU(e.target.value)} required />
            </div>
            <div className="form-grid" style={{ marginBottom: '.75rem' }}>
              <div className="form-group">
                <label>Password *</label>
                <div className="pw-input-wrap">
                  <input type={showP ? "text" : "password"} className="form-control" value={p} onChange={e=>setP(e.target.value)} required style={{ paddingRight: '2.5rem' }} />
                  <button type="button" className="pw-toggle" onClick={() => setShowP(!showP)} tabIndex="-1"><i className={`fa-regular ${showP ? 'fa-eye-slash' : 'fa-eye'}`}></i></button>
                </div>
              </div>
              <div className="form-group">
                <label>Confirm Password *</label>
                <div className="pw-input-wrap">
                  <input type={showP ? "text" : "password"} className="form-control" value={cp} onChange={e=>setCp(e.target.value)} required style={{ paddingRight: '2.5rem' }} />
                  <button type="button" className="pw-toggle" onClick={() => setShowP(!showP)} tabIndex="-1"><i className={`fa-regular ${showP ? 'fa-eye-slash' : 'fa-eye'}`}></i></button>
                </div>
              </div>
            </div>
            <div className="form-group" style={{ marginBottom: '.75rem' }}>
              <label>Security Question (for password reset) *</label>
              <select className="form-control" value={sq} onChange={e=>setSq(e.target.value)}>
                <option>What is Srila Prabhupada's first book?</option>
                <option>What is your home temple location?</option>
                <option>What is your favorite Prabhupada book?</option>
              </select>
            </div>
            <div className="form-group" style={{ marginBottom: '1.2rem' }}>
              <label>Security Answer *</label>
              <input type="text" className="form-control" placeholder="Answer for account recovery" value={sa} onChange={e=>setSa(e.target.value)} required />
            </div>
            <button type="submit" className="nav-btn btn-emerald" style={{ width: '100%', justifyContent: 'center', padding: '.8rem', fontSize: '1rem' }}>
              <i className="fa-solid fa-user-plus"></i> Create Account & Launch Workspace
            </button>
          </form>
        )}

        {mode === 'forgot' && forgotStep === 1 && (
          <form onSubmit={handleForgotCheckUser}>
            <div className="form-group" style={{ marginBottom: '1.2rem' }}>
              <label>Enter your Username *</label>
              <input type="text" className="form-control" placeholder="Your username" value={u} onChange={e=>setU(e.target.value)} required />
            </div>
            <button type="submit" className="nav-btn btn-indigo" style={{ width: '100%', justifyContent: 'center', padding: '.8rem' }}>
              <i className="fa-solid fa-magnifying-glass"></i> Find Account
            </button>
          </form>
        )}

        {mode === 'forgot' && forgotStep === 2 && recoveryUserDoc && (
          <form onSubmit={handleResetPassword}>
            <div style={{ background: 'rgba(255,255,255,.05)', padding: '.75rem', borderRadius: 'var(--radius-sm)', marginBottom: '1rem', fontSize: '.88rem' }}>
              Account: <b>{recoveryUserDoc.username}</b><br/>
              Security Question: <span style={{ color: 'var(--primary-amber)' }}>{recoveryUserDoc.securityQuestion}</span>
            </div>
            <div className="form-group" style={{ marginBottom: '.75rem' }}>
              <label>Security Answer *</label>
              <input type="text" className="form-control" placeholder="Your recovery answer" value={sa} onChange={e=>setSa(e.target.value)} required />
            </div>
            <div className="form-group" style={{ marginBottom: '1.2rem' }}>
              <label>New Password *</label>
              <div className="pw-input-wrap">
                <input type={showP ? "text" : "password"} className="form-control" placeholder="New password" value={newP} onChange={e=>setNewP(e.target.value)} required style={{ paddingRight: '2.5rem' }} />

      name: name.trim(),
      contact: contact.trim(),
      createdAt: TS()
    });

    setName('');
    setContact('');
  };

}

function Dashboard({ stockVouchers, issueVouchers, returnVouchers }) {
  const inv = {};
  stockVouchers.forEach(sv=>sv.items.forEach(i=>{const k=`${i.bookName}__${i.language||'English'}`;if(!inv[k])inv[k]={bookName:i.bookName,language:i.language||'English',price:i.price,received:0,issued:0,returned:0,sold:0,collected:0};inv[k].received+=Number(i.quantity)||0;}));
  issueVouchers.forEach(iv=>iv.items.forEach(i=>{const k=`${i.bookName}__${i.language||'English'}`;if(!inv[k])inv[k]={bookName:i.bookName,language:i.language||'English',price:i.price,received:0,issued:0,returned:0,sold:0,collected:0};inv[k].issued+=Number(i.quantityIssued)||0;}));
  returnVouchers.forEach(rv=>rv.items.forEach(i=>{const k=`${i.bookName}__${i.language||'English'}`;if(!inv[k])inv[k]={bookName:i.bookName,language:i.language||'English',price:i.price,received:0,issued:0,returned:0,sold:0,collected:0};inv[k].returned+=Number(i.quantityReturned)||0;inv[k].sold+=Number(i.quantitySold)||0;inv[k].collected+=Number(i.amountCollected)||0;}));
  const list=Object.values(inv).map(x=>({...x,available:x.received-x.issued+x.returned}));
  const totRec=list.reduce((s,x)=>s+x.received,0), totIss=list.reduce((s,x)=>s+x.issued,0), totRet=list.reduce((s,x)=>s+x.returned,0), totAvail=totRec-totIss+totRet, totSold=list.reduce((s,x)=>s+x.sold,0), totCol=list.reduce((s,x)=>s+x.collected,0);

        <div className="stat-card purple"><div className="stat-header"><span className="stat-title">Total Donation Collected</span><div className="stat-icon purple"><i className="fa-solid fa-indian-rupee-sign"></i></div></div><div className="stat-value" style={{color:'var(--accent-purple)'}}>{fmt(totCol)}</div><div className="stat-sub">Total sales revenue</div></div>
      </div>
      <div className="glass-panel" style={{borderTop:'3px solid var(--primary-amber)'}}>
        <div className="panel-header">
          <div className="panel-title"><i className="fa-solid fa-book-bookmark" style={{color:'var(--primary-amber)'}}></i>Store Inventory — Per Book & Language</div>
          <span className="badge badge-amber">{list.length} Stock Items</span>

        <div className="table-responsive">
          <table className="custom-table">
            <thead><tr><th>Book Title</th><th>Language</th><th>Price</th><th>Received</th><th>Issued</th><th>Returned</th><th style={{background:'rgba(16,185,129,.2)',color:'#fff'}}>Sold</th><th style={{background:'rgba(16,185,129,.2)',color:'#fff'}}>Donation</th><th style={{background:'rgba(245,158,11,.25)',color:'#fff'}}>Available (Recv−Iss+Ret)</th></tr></thead>

                <tr key={i}>
                  <td style={{fontWeight:600}}>{x.bookName}</td>
                  <td><span className="badge badge-blue">{x.language}</span></td>
                  <td>₹{x.price}</td>
                  <td><span className="badge badge-amber">{x.received}</span></td>
                  <td><span className="badge badge-purple">{x.issued}</span></td>
                  <td><span className="badge badge-emerald">+{x.returned}</span></td>

function StockModal({ isOpen, onClose, masterBooks, stockVouchers, onAdd, editData }) {

  const [entryNo,setEntryNo]=useState('');

  useEffect(() => {
    if (isOpen) {
      if (editData) {
        setEntryNo(editData.entryNo);
        setDate(editData.date);
        setRecvBy(editData.receivedBy);
        setItems(editData.items);
      } else {
        setEntryNo(generateNextId('STK', stockVouchers, 'entryNo'));
        setDate(today);
        setRecvBy('FOLK Main Store');
        setItems([{bookName:masterBooks[0]?.name||'Bhagavad Gita As It Is',language:'English',quantity:50,price:masterBooks[0]?.defaultPrice||250}]);

  }, [isOpen, editData, stockVouchers, masterBooks, today]);

  const addRow=()=>setItems([...items,{bookName:masterBooks[0]?.name,language:'Hindi',quantity:10,price:masterBooks[0]?.defaultPrice||250}]);
  const remRow=(i)=>{if(items.length===1)return alert('At least one row required.');setItems(items.filter((_,j)=>j!==i));};
  const chg=(i,f,v)=>{const n=[...items];n[i][f]=v;if(f==='bookName'){const m=masterBooks.find(b=>b.name===v);if(m)n[i].price=m.defaultPrice;}setItems(n);};
  const totQty=items.reduce((s,x)=>s+(Number(x.quantity)||0),0);
  const totAmt=items.reduce((s,x)=>s+(Number(x.quantity)||0)*(Number(x.price)||0),0);
  const submit=(e)=>{e.preventDefault();if(totQty<=0)return alert('Enter valid quantities.');onAdd({id:editData?editData.id:`stk-${Date.now()}`,firestoreId:editData?.firestoreId,entryNo,date,receivedBy:recvBy,items:items.map(x=>({...x,quantity:Number(x.quantity)||0,price:Number(x.price)||0,lineTotal:(Number(x.quantity)||0)*(Number(x.price)||0)})),totalQty:totQty,totalAmount:totAmt});onClose();};
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-card" onClick={e=>e.stopPropagation()}>
        <div className="modal-header"><h3><i className="fa-solid fa-boxes-stacked" style={{color:'var(--primary-amber)'}}></i> Temple Stock Receipt</h3><button className="close-btn" onClick={onClose}><i className="fa-solid fa-xmark"></i></button></div>
        <form onSubmit={submit}>
          <div className="modal-body">
            <div className="form-grid">
              <div className="form-group"><label>Receipt Entry No *</label><input type="text" className="form-control" value={entryNo} onChange={e=>setEntryNo(e.target.value)} required /></div>
              <div className="form-group"><label>Date *</label><input type="date" className="form-control" value={date} onChange={e=>setDate(e.target.value)} required /></div>
              <div className="form-group"><label>Received From / Store</label><input type="text" className="form-control" value={recvBy} onChange={e=>setRecvBy(e.target.value)} /></div>
            </div>
            <div style={{borderTop:'1px solid var(--border-subtle)',paddingTop:'1rem'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'.5rem'}}>
                <h4 style={{fontSize:'.95rem',color:'var(--primary-amber)'}}>Books Received</h4>
                <button type="button" className="nav-btn btn-secondary" style={{padding:'.3rem .7rem',fontSize:'.8rem'}} onClick={addRow}><i className="fa-solid fa-plus"></i> Add Row</button>
              </div>
              <table className="multi-item-table">
                <thead><tr><th>Book Title</th><th style={{width:'130px'}}>Language</th><th style={{width:'80px'}}>Qty</th><th style={{width:'90px'}}>Price ₹</th><th style={{width:'100px'}}>Total</th><th style={{width:'36px'}}></th></tr></thead>
                <tbody>

                      <td><select className="form-control" value={x.language} onChange={e=>chg(i,'language',e.target.value)}>{LANGS.map(l=><option key={l}>{l}</option>)}</select></td>

                      <td style={{fontWeight:700,color:'var(--primary-amber)'}}>{fmt((Number(x.quantity)||0)*(Number(x.price)||0))}</td>

        </form>
      </div>
    </div>
  );
}

// ── Issue Modal ───────────────────────────────────────────────
function IssueModal({ isOpen, onClose, masterBooks, stockVouchers, issueVouchers, returnVouchers, devotees, onAdd, editData }) {
  const today=new Date().toISOString().split('T')[0];
  const [issueNo,setIssueNo]=useState('');
  const [issueDate,setIssueDate]=useState(today);
  const [devName,setDevName]=useState('');
  const [devoteeType, setDevoteeType] = useState('Solo');
  const [groupMembers, setGroupMembers] = useState([]);
  const [loc,setLoc]=useState('Metro Station Plaza');
  const getPrice = (bn, lang) => {
    for (let sv of stockVouchers) {
      for (let item of sv.items) {
        if (item.bookName === bn && (item.language || 'English') === lang) return item.price;
      }
    }
    const m = masterBooks.find(b=>b.name===bn);
    return m?.defaultPrice || 250;
  };
  const [items,setItems]=useState([{bookName:masterBooks[0]?.name||'Bhagavad Gita As It Is',language:'English',quantityIssued:10,price:getPrice(masterBooks[0]?.name||'Bhagavad Gita As It Is','English')}]);
  
  useEffect(() => {
    if (isOpen) {
      if (editData) {
        setIssueNo(editData.issueNo);
        setIssueDate(editData.issueDate);
        setDevName(editData.devoteeName);
        setDevoteeType(editData.devoteeType || 'Solo');
        setGroupMembers(editData.groupMembers || []);
        setLoc(editData.location);
        setItems(editData.items);
      } else {
        setIssueNo(generateNextId('ISS', issueVouchers, 'issueNo'));
        setIssueDate(today);
        setDevName('');
        setDevoteeType('Solo');
        setGroupMembers([]);
        setLoc('Metro Station Plaza');
        setItems([{bookName:masterBooks[0]?.name||'Bhagavad Gita As It Is',language:'English',quantityIssued:10,price:getPrice(masterBooks[0]?.name||'Bhagavad Gita As It Is','English')}]);
      }
    }
  }, [isOpen, editData, issueVouchers, masterBooks, today]);

  if(!isOpen)return null;
  const avail=(bn,lang)=>{
    let r=0;stockVouchers.forEach(sv=>sv.items.forEach(i=>{if(i.bookName===bn&&(i.language||'English')===lang)r+=Number(i.quantity)||0;}));
    let is=0;issueVouchers.forEach(iv=>iv.items.forEach(i=>{if(i.bookName===bn&&(i.language||'English')===lang)is+=Number(i.quantityIssued)||0;}));
    let rt=0;returnVouchers.forEach(rv=>rv.items.forEach(i=>{if(i.bookName===bn&&(i.language||'English')===lang)rt+=Number(i.quantityReturned)||0;}));
    return r-is+rt;
  };
  let errMsg=null;
  for(const x of items){if((Number(x.quantityIssued)||0)>avail(x.bookName,x.language)){errMsg=`Only ${avail(x.bookName,x.language)} copies of "${x.bookName}" (${x.language}) available in store.`;break;}}
  const addRow=()=>setItems([...items,{bookName:masterBooks[0]?.name,language:'Hindi',quantityIssued:5,price:getPrice(masterBooks[0]?.name,'Hindi')}]);
  const remRow=(i)=>{if(items.length===1)return alert('At least one item required.');setItems(items.filter((_,j)=>j!==i));};
  const chg=(i,f,v)=>{
    const n=[...items];
    n[i][f]=v;
    if(f==='bookName'||f==='language') n[i].price=getPrice(n[i].bookName, n[i].language);
    setItems(n);
  };
  const submit=(e)=>{
    e.preventDefault();
    if(errMsg){alert(errMsg);return;}
    if(!devName.trim())return alert('Select Devotee/Team Leader.');
    const leader = (devotees||[]).find(x=>x.name===devName);
    onAdd({
      id:editData?editData.id:`iss-${Date.now()}`,
      firestoreId:editData?.firestoreId,
      issueNo,
      issueDate,
      devoteeName:devName.trim(),
      devoteeContact: leader?.contact || '',
      devoteeType,
      groupMembers: devoteeType === 'Group' ? groupMembers : [],
      location:loc.trim(),
      items:items.map(x=>({...x,quantityIssued:Number(x.quantityIssued)||0,price:Number(x.price)||0})),
      totalIssuedQty:items.reduce((s,x)=>s+(Number(x.quantityIssued)||0),0),
      status:'Active'
    });
    onClose();
  };
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-card" onClick={e=>e.stopPropagation()}>
        <div className="modal-header"><h3><i className="fa-solid fa-hand-holding-hand" style={{color:'var(--accent-indigo)'}}></i> Issue Books to Devotee</h3><button className="close-btn" onClick={onClose}><i className="fa-solid fa-xmark"></i></button></div>
        <form onSubmit={submit}>
          <div className="modal-body">
            <div className="form-grid">
              <div className="form-group"><label>Issue Voucher No *</label><input type="text" className="form-control" value={issueNo} onChange={e=>setIssueNo(e.target.value)} required /></div>
              <div className="form-group"><label>Issue Date *</label><input type="date" className="form-control" value={issueDate} onChange={e=>setIssueDate(e.target.value)} required /></div>
            </div>
            <div className="form-grid">
              <div className="form-group"><label>Devotee / Team Leader *</label>
                <select className="form-control" value={devName} onChange={e=>setDevName(e.target.value)} required>
                  <option value="">-- Select Devotee --</option>
                  {(devotees||[]).map(d=><option key={d.firestoreId} value={d.name}>{d.name} {d.contact?`(${d.contact})`:''}</option>)}
                </select>
              </div>
              <div className="form-group"><label>Distribution Type *</label>
                <select className="form-control" value={devoteeType} onChange={e=>setDevoteeType(e.target.value)}>
                  <option value="Solo">Solo Distribution</option>
                  <option value="Group">Group / Team</option>
                </select>
              </div>
            </div>
            
            {devoteeType === 'Group' && (
              <div className="form-group" style={{ marginBottom: '1rem', background: 'rgba(255,255,255,.05)', padding: '1rem', borderRadius: 'var(--radius-sm)', border: '1px solid var(--border-subtle)' }}>
                <label style={{ color: 'var(--accent-purple)' }}>Add Team Members</label>
                <div style={{ display: 'flex', gap: '.5rem', marginBottom: '.5rem' }}>
                  <select className="form-control" id="addMemberSelect">
                    <option value="">Select group member...</option>
                    {(devotees||[]).filter(d => d.name !== devName && !groupMembers.some(g => g.name === d.name)).map(d => (
                      <option key={d.firestoreId} value={JSON.stringify({name: d.name, contact: d.contact})}>{d.name} {d.contact?`(${d.contact})`:''}</option>
                    ))}
                  </select>
                  <button type="button" className="nav-btn btn-primary" onClick={()=>{
                    const v = document.getElementById('addMemberSelect').value;
                    if(v) { setGroupMembers([...groupMembers, JSON.parse(v)]); document.getElementById('addMemberSelect').value = ''; }
                  }}>Add</button>
                </div>
                {groupMembers.length > 0 && (
                  <div style={{ display: 'flex', gap: '.5rem', flexWrap: 'wrap' }}>
                    {groupMembers.map((gm, i) => (
                      <span key={i} className="badge badge-purple" style={{ display: 'flex', alignItems: 'center', gap: '.5rem' }}>
                        {gm.name}
                        <i className="fa-solid fa-xmark" style={{ cursor: 'pointer' }} onClick={() => setGroupMembers(groupMembers.filter((_,j) => j !== i))}></i>
                      </span>
                    ))}
                  </div>
                )}
              </div>
            )}
            
            <div className="form-grid">
              <div className="form-group"><label>Distribution Location *</label><input type="text" className="form-control" placeholder="Location / Place" value={loc} onChange={e=>setLoc(e.target.value)} required /></div>
            </div>
            {errMsg&&<div className="error-banner"><i className="fa-solid fa-triangle-exclamation" style={{fontSize:'1.2rem'}}></i><span>{errMsg}</span></div>}
            <div style={{borderTop:'1px solid var(--border-subtle)',paddingTop:'1rem'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'.5rem'}}>
                <h4 style={{fontSize:'.95rem',color:'var(--accent-indigo)'}}>Books to Issue</h4>
                <button type="button" className="nav-btn btn-secondary" style={{padding:'.3rem .7rem',fontSize:'.8rem'}} onClick={addRow}><i className="fa-solid fa-plus"></i> Add Row</button>
              </div>
              <table className="multi-item-table">
                <thead><tr><th>Book Title</th><th style={{width:'110px'}}>Language</th><th style={{width:'70px'}}>Qty</th><th style={{width:'80px'}}>Price ₹</th><th style={{width:'90px'}}>Store Avail</th><th style={{width:'36px'}}></th></tr></thead>
                <tbody>
                  {items.map((x,i)=>{const av=avail(x.bookName,x.language);const over=(Number(x.quantityIssued)||0)>av;return(
                    <tr key={i}>
                      <td><select className="form-control" value={x.bookName} onChange={e=>chg(i,'bookName',e.target.value)}>{masterBooks.map(b=><option key={b.id} value={b.name}>{b.name}</option>)}</select></td>
                      <td><select className="form-control" value={x.language} onChange={e=>chg(i,'language',e.target.value)}>{LANGS.map(l=><option key={l}>{l}</option>)}</select></td>
                      <td><input type="number" min="1" className="form-control" style={{borderColor:over?'var(--accent-rose)':'var(--border-subtle)'}} value={x.quantityIssued} onChange={e=>chg(i,'quantityIssued',e.target.value)} required /></td>
                      <td><input type="number" min="1" className="form-control" value={x.price} onChange={e=>chg(i,'price',e.target.value)} required /></td>
                      <td><span className={`badge ${av<=0?'badge-rose':'badge-emerald'}`}>{av} Pcs</span></td>
                      <td><button type="button" className="close-btn" style={{color:'var(--accent-rose)'}} onClick={()=>remRow(i)}><i className="fa-solid fa-trash-can"></i></button></td>
                    </tr>
                  );})}
                </tbody>
              </table>
            </div>
          </div>
          <div className="modal-footer"><button type="button" className="nav-btn btn-secondary" onClick={onClose}>Cancel</button><button type="submit" className="nav-btn btn-indigo" disabled={!!errMsg}><i className="fa-solid fa-cloud-arrow-up"></i> Confirm Issue</button></div>
        </form>
      </div>
    </div>
  );
}

// ── Return Modal ──────────────────────────────────────────────
function ReturnModal({ isOpen, onClose, issueVouchers, returnVouchers, onAdd, editData }) {
  const today=new Date().toISOString().split('T')[0];
  const [returnNo,setReturnNo]=useState('');
  const [returnDate,setReturnDate]=useState(today);
  const [items,setItems]=useState([]);
  const active=issueVouchers.filter(i=>i.status!=='Returned' || (editData && i.issueNo === editData.issueNo));
  const [filter,setFilter]=useState('');
  const [selNo,setSelNo]=useState('');

  useEffect(() => {
    if (isOpen) {
      if (editData) {
        setReturnNo(editData.returnNo);
        setReturnDate(editData.returnDate);
        setSelNo(editData.issueNo);
        setItems(editData.items);
      } else {
        setReturnNo(generateNextId('RET', returnVouchers, 'returnNo'));
        if(active.length>0){const f=active[0];setSelNo(f.issueNo);setItems(f.items.map(x=>({...x,quantityReturned:0})));}
      }
    }
  }, [isOpen, editData, returnVouchers]);

  if(!isOpen)return null;
  const filtered=active.filter(i=>i.issueNo.toLowerCase().includes(filter.toLowerCase().trim())||i.devoteeName.toLowerCase().includes(filter.toLowerCase().trim())||i.location.toLowerCase().includes(filter.toLowerCase().trim()));
  useEffect(()=>{if(active.length>0){const f=filtered[0]||active[0];setSelNo(f.issueNo);setItems(f.items.map(x=>({...x,quantityReturned:0})));}}, [isOpen,filter]);
  if(!isOpen)return null;
  const cur=issueVouchers.find(i=>i.issueNo===selNo)||active[0];
  const selChg=(v)=>{setSelNo(v);const iv=issueVouchers.find(i=>i.issueNo===v);if(iv)setItems(iv.items.map(x=>({...x,quantityReturned:0})));};
  const retChg=(i,v)=>{const n=[...items];n[i].quantityReturned=v;setItems(n);};
  const proc=items.map(x=>{const r=Math.max(0,Math.min(x.quantityIssued,Number(x.quantityReturned)||0));const s=Math.max(0,x.quantityIssued-r);return{...x,quantityReturned:r,quantitySold:s,amountCollected:s*x.price};});
  const totRet=proc.reduce((s,x)=>s+x.quantityReturned,0);
  const totSold=proc.reduce((s,x)=>s+x.quantitySold,0);
  const totCol=proc.reduce((s,x)=>s+x.amountCollected,0);
  const submit=(e)=>{
    e.preventDefault();
    if(!cur)return alert('Select an issue voucher.');
    onAdd({
      id:editData?editData.id:`ret-${Date.now()}`,
      firestoreId:editData?.firestoreId,
      returnNo,
      issueNo:cur.issueNo,
      returnDate,
      devoteeName:cur.devoteeName,
      devoteeContact:cur.devoteeContact || '',
      devoteeType: cur.devoteeType || 'Solo',
      groupMembers: cur.groupMembers || [],
      location:cur.location,
      items:proc,
      totalReturnedQty:totRet,
      totalSoldQty:totSold,
      totalAmountCollected:totCol
    });
    onClose();
  };
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-card" onClick={e=>e.stopPropagation()}>
        <div className="modal-header"><h3><i className="fa-solid fa-rotate-left" style={{color:'var(--accent-emerald)'}}></i> Process Book Return</h3><button className="close-btn" onClick={onClose}><i className="fa-solid fa-xmark"></i></button></div>
        <form onSubmit={submit}>
          <div className="modal-body">
            <div className="form-group"><label>Search Issue Voucher (by No or Devotee Name)</label><input type="text" className="form-control" placeholder="e.g. ISS-2026-001 or Devotee Name..." value={filter} onChange={e=>setFilter(e.target.value)} /></div>
            <div className="form-grid">
              <div className="form-group"><label>Select Issue Voucher *</label>
                <select className="form-control" value={selNo} onChange={e=>selChg(e.target.value)}>
                  {filtered.length===0?<option value="">No active vouchers found</option>:filtered.map(i=><option key={i.id} value={i.issueNo}>{i.issueNo} — {i.devoteeName} ({i.totalIssuedQty} Books) [{i.location}]</option>)}
                </select>
              </div>
            </div>
            <div className="form-grid" style={{ marginTop: '1rem' }}>
              <div className="form-group"><label>Return Voucher No *</label><input type="text" className="form-control" value={returnNo} onChange={e=>setReturnNo(e.target.value)} required /></div>
              <div className="form-group"><label>Return Date *</label><input type="date" className="form-control" value={returnDate} onChange={e=>setReturnDate(e.target.value)} required /></div>
            </div>
            {cur&&(
              <div style={{borderTop:'1px solid var(--border-subtle)',paddingTop:'1rem'}}>
                <div style={{marginBottom:'.5rem',fontSize:'.88rem',color:'var(--primary-amber)'}}>Voucher: <b>{cur.issueNo}</b> | Devotee: <b>{cur.devoteeName}</b> | Location: <b>{cur.location}</b></div>
                <table className="multi-item-table">
                  <thead><tr><th>Book & Language</th><th>Issued</th><th>Qty Returned</th><th style={{color:'var(--accent-emerald)'}}>Sold (Auto)</th><th style={{color:'var(--accent-emerald)'}}>Donation</th></tr></thead>
                  <tbody>
                    {proc.map((x,i)=>(
                      <tr key={i}>
                        <td style={{fontWeight:600}}>{x.bookName} ({x.language||'English'})</td>
                        <td>{x.quantityIssued}</td>
                        <td style={{width:'100px'}}><input type="number" min="0" max={x.quantityIssued} className="form-control" value={x.quantityReturned} onChange={e=>retChg(i,e.target.value)} /></td>
                        <td><span className="badge badge-emerald">{x.quantitySold} Sold</span></td>
                        <td style={{fontWeight:700,color:'var(--accent-emerald)'}}>{fmt(x.amountCollected)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                <div style={{background:'rgba(16,185,129,.1)',border:'1px solid rgba(16,185,129,.3)',borderRadius:'var(--radius-sm)',padding:'1rem',display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:'1rem',marginTop:'1rem'}}>
                  <div><div style={{fontSize:'.75rem',color:'var(--text-muted)'}}>Returned (Adds to Store)</div><div style={{fontSize:'1.3rem',fontWeight:700,color:'var(--primary-amber)'}}>+{totRet} Books</div></div>
                  <div><div style={{fontSize:'.75rem',color:'var(--text-muted)'}}>Books Sold</div><div style={{fontSize:'1.3rem',fontWeight:700,color:'var(--accent-emerald)'}}>{totSold} Books</div></div>
                  <div><div style={{fontSize:'.75rem',color:'var(--text-muted)'}}>Donation Collected</div><div style={{fontSize:'1.3rem',fontWeight:700,color:'var(--accent-emerald)'}}>{fmt(totCol)}</div></div>
                </div>
              </div>
            )}
          </div>
          <div className="modal-footer"><button type="button" className="nav-btn btn-secondary" onClick={onClose}>Cancel</button><button type="submit" className="nav-btn btn-emerald" disabled={!cur}><i className="fa-solid fa-cloud-arrow-up"></i> Save Return & Update Stock</button></div>
        </form>
      </div>
    </div>
  );
}

  );

// ── Tables ────────────────────────────────────────────────────
function StockTable({ stockVouchers, onOpen, onDelete, onPrint, onEdit }) {
  const [q,setQ]=useState('');
  const fil=stockVouchers.filter(sv=>{
    const en = (sv.entryNo || sv.stockNo || '').toLowerCase();
    const rb = (sv.receivedBy || sv.receiverName || '').toLowerCase();
    const qq = q.toLowerCase().trim();
    return en.includes(qq) || rb.includes(qq) || sv.items?.some(i=>(i.bookName||'').toLowerCase().includes(qq));
  });
  return (
    <div className="glass-panel">
      <div className="panel-header"><div className="panel-title"><i className="fa-solid fa-boxes-stacked" style={{color:'var(--primary-amber)'}}></i> 1. Temple Stock Receipts</div><button className="nav-btn btn-primary" onClick={onOpen}><i className="fa-solid fa-plus"></i> New Receipt</button></div>
      <div className="section-search-bar"><div className="section-search-input-wrap"><i className="fa-solid fa-magnifying-glass"></i><input type="text" className="section-search-input" placeholder="Search by Receipt No (STK-2026-001), Store or Book..." value={q} onChange={e=>setQ(e.target.value)} /></div>{q&&<span className="badge badge-amber">{fil.length} Matches</span>}</div>
      <div className="table-responsive"><table className="custom-table">
        <thead><tr><th>Receipt No</th><th>Date</th><th>Received From</th><th>Books</th><th>Total Qty</th><th>Total Amount</th><th className="no-print">Action</th></tr></thead>
        <tbody>{fil.length===0?<tr><td colSpan="7" style={{textAlign:'center',padding:'2rem',color:'var(--text-muted)'}}>No records found.</td></tr>:fil.map(sv=>(
          <tr key={sv.firestoreId||sv.id}>
            <td style={{fontWeight:700,color:'var(--primary-amber)'}}>{sv.entryNo || sv.stockNo}</td>
            <td>{fmtDate(sv.date || sv.receiptDate)}</td>
            <td>{sv.receivedBy || sv.receiverName}</td>
            <td>{sv.items.map((i,idx)=><div key={idx} style={{fontSize:'.82rem'}}>{i.bookName} ({i.language||'English'}) — {i.quantity} @ ₹{i.price}</div>)}</td>
            <td><span className="badge badge-amber">{sv.totalQty} Books</span></td>
            <td style={{fontWeight:700,color:'var(--primary-amber)'}}>{fmt(sv.totalAmount)}</td>
            <td className="no-print" style={{display:'flex',gap:'.4rem'}}>
              <button className="nav-btn btn-secondary" style={{padding:'.3rem .6rem',fontSize:'.75rem'}} onClick={()=>onPrint(sv)}><i className="fa-solid fa-print"></i></button>

function Analytics({ returnVouchers, db, creds, user }) {
  const [subTab, setSubTab] = useState('local'); // 'local' or 'universal'
  const [preset, setPreset] = useState('all'); // 'all' | 'today' | 'this_month' | 'this_year' | 'custom'
  const [startDate, setStartDate] = useState('');
  const [endDate, setEndDate] = useState('');
  const [globalCredits, setGlobalCredits] = useState([]);

  useEffect(() => {
    if (subTab === 'universal' && db) {
      return db.collection('globalCredits').onSnapshot(s => {
        setGlobalCredits(s.docs.map(d => d.data()));
      });
    }
  }, [subTab, db]);

  const checkDate = (dateStr) => {
    if (!dateStr) return true;
    const d = new Date(dateStr);
    if (isNaN(d)) return true;
    const now = new Date();
    if (preset === 'today') return d.toDateString() === now.toDateString();
    if (preset === 'this_month') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    if (preset === 'this_year') return d.getFullYear() === now.getFullYear();
    if (preset === 'custom') {
      if (startDate && d < new Date(startDate)) return false;
      if (endDate && d > new Date(endDate + 'T23:59:59')) return false;
    }
    return true;
  };

  // Filter vouchers by selected date / month / year period
  const filteredVouchers = returnVouchers.filter(rv => checkDate(rv.returnDate));
  const filteredGlobals = globalCredits.filter(gc => {
    if (!checkDate(gc.date)) return false;
    if (creds.participateLeaderboard === false && gc.storeName === (user?.tenantKey || 'folk')) return false;
    return true;
  });

  // Universal Rankings Computation
  const gcGrouped = {};
  filteredGlobals.forEach(gc => {
    const k = gc.searchKey;
    if (!gcGrouped[k]) gcGrouped[k] = { name: gc.devoteeName, qty: 0, stores: new Set() };
    gcGrouped[k].qty += gc.totalSoldQty;
    gcGrouped[k].stores.add(gc.storeName);
  });
  const URanking = Object.values(gcGrouped).map(r => ({ ...r, stores: Array.from(r.stores).join(', ') })).sort((a, b) => b.qty - a.qty);

  const bk={}, dv={}, dvDisplay={}, lc={}, lg={};
  filteredVouchers.forEach(rv => {
    // Split logic for Devotee Leaderboard
    const isGroup = rv.devoteeType === 'Group' && rv.groupMembers?.length > 0;
    const count = isGroup ? rv.groupMembers.length + 1 : 1;
    const splitSold = Math.floor((rv.totalSoldQty || 0) / count);
    const splitAmt = Math.floor((rv.totalAmountCollected || 0) / count);
    const remSold = (rv.totalSoldQty || 0) % count;
    const remAmt = (rv.totalAmountCollected || 0) % count;

    const addStat = (name, sqty, samt) => {
      if (!name) return;
      const dKey = name.trim().toLowerCase();
      const dLabel = name.trim();
      if (!dv[dKey]) { dv[dKey] = { qty: 0, amt: 0 }; dvDisplay[dKey] = dLabel; }
      dv[dKey].qty += sqty;
      dv[dKey].amt += samt;
    };

    if (isGroup) {
      addStat(rv.devoteeName, splitSold + remSold, splitAmt + remAmt);
      rv.groupMembers.forEach(m => addStat(m.name || m, splitSold, splitAmt));
    } else {
      addStat(rv.devoteeName, rv.totalSoldQty || 0, rv.totalAmountCollected || 0);
    }
    
    const l = rv.location;
    if (!lc[l]) lc[l] = { qty: 0, amt: 0 }; lc[l].qty += rv.totalSoldQty; lc[l].amt += rv.totalAmountCollected;
    rv.items.forEach(i => {
      const b = i.bookName, la = i.language || 'English';
      if (!bk[b]) bk[b] = { qty: 0, amt: 0 }; bk[b].qty += i.quantitySold; bk[b].amt += i.amountCollected;
      if (!lg[la]) lg[la] = { qty: 0, amt: 0 }; lg[la].qty += i.quantitySold; lg[la].amt += i.amountCollected;
    });
  });
  // Map dv back with original display label
  const dvMapped = {};
  Object.keys(dv).forEach(k => { dvMapped[dvDisplay[k] || k] = dv[k]; });

  const sort = obj => Object.keys(obj).map(k => ({ name: k, ...obj[k] })).sort((a, b) => b.qty - a.qty);
  const TB = sort(bk), TD = sort(dvMapped), TL = sort(lc), TG = sort(lg);

  const Tbl = ({ data, cols }) => (
    <div className="table-responsive">
      <table className="custom-table">
        <thead><tr>{cols.map(c => <th key={c}>{c}</th>)}</tr></thead>
        <tbody>
          {data.length === 0 ? (
            <tr><td colSpan={cols.length} style={{ textAlign: 'center', padding: '1.5rem', color: 'var(--text-muted)' }}>No data for selected period.</td></tr>
          ) : (
            data.map((r, i) => (
              <tr key={i}><td><b>#{i + 1}</b></td><td style={{ fontWeight: 600 }}>{r.name}</td><td><span className="badge badge-emerald">{r.qty} Pcs</span></td><td style={{ fontWeight: 700, color: 'var(--accent-emerald)' }}>{fmt(r.amt)}</td></tr>
            ))
          )}
        </tbody>
      </table>
    </div>
  );

  const Tbl2 = ({ data }) => (
    <div className="table-responsive">
      <table className="custom-table">
        <thead><tr><th>Place/Language</th><th>Books Sold</th><th>Collection</th></tr></thead>
        <tbody>
          {data.length === 0 ? (
            <tr><td colSpan="3" style={{ textAlign: 'center', padding: '1.5rem', color: 'var(--text-muted)' }}>No data for selected period.</td></tr>
          ) : (
            data.map((r, i) => (
              <tr key={i}><td>{r.name}</td><td><span className="badge badge-blue">{r.qty}</span></td><td style={{ fontWeight: 700 }}>{fmt(r.amt)}</td></tr>
            ))
          )}
        </tbody>
      </table>
    </div>
  );

  return (
    <div className="glass-panel">
      <div className="panel-header" style={{ borderBottom: 'none', paddingBottom: 0 }}>
        <div className="panel-title"><i className="fa-solid fa-chart-line" style={{ color: 'var(--accent-purple)' }}></i> Distribution Analytics & Statistics</div>
        <div style={{ display: 'flex', gap: '1rem' }}>
          <button className={`nav-btn ${subTab==='local'?'btn-primary':'btn-secondary'}`} onClick={() => setSubTab('local')}><i className="fa-solid fa-store"></i> Local Store</button>
          <button className={`nav-btn ${subTab==='universal'?'btn-emerald':'btn-secondary'}`} onClick={() => setSubTab('universal')}><i className="fa-solid fa-earth-americas"></i> Universal Rankings</button>
          <button className="nav-btn btn-indigo no-print" onClick={() => window.print()}><i className="fa-solid fa-print"></i> Print</button>
        </div>
      </div>

      <div style={{ padding: '0 1.5rem 1.5rem' }}>
        {/* Date, Month, Year & Custom Period Filter */}
        <div className="no-print" style={{ display: 'flex', flexWrap: 'wrap', gap: '1rem', alignItems: 'center', marginBottom: '1.5rem', marginTop: '1rem', background: 'rgba(15,23,42,0.8)', padding: '.75rem 1rem', borderRadius: 'var(--radius-sm)', border: '1px solid var(--border-subtle)' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: '.5rem', fontSize: '.85rem', fontWeight: 600, color: 'var(--primary-amber)' }}>
            <i className="fa-solid fa-calendar-days"></i> Filter Period:
          </div>
          <div style={{ display: 'flex', gap: '.4rem', flexWrap: 'wrap' }}>
            <button type="button" className={`nav-btn ${preset==='all'?'btn-primary':'btn-secondary'}`} style={{ padding: '.3rem .75rem', fontSize: '.8rem' }} onClick={() => setPreset('all')}>All Time</button>
            <button type="button" className={`nav-btn ${preset==='today'?'btn-primary':'btn-secondary'}`} style={{ padding: '.3rem .75rem', fontSize: '.8rem' }} onClick={() => setPreset('today')}>Today</button>
            <button type="button" className={`nav-btn ${preset==='this_month'?'btn-primary':'btn-secondary'}`} style={{ padding: '.3rem .75rem', fontSize: '.8rem' }} onClick={() => setPreset('this_month')}>This Month</button>
            <button type="button" className={`nav-btn ${preset==='this_year'?'btn-primary':'btn-secondary'}`} style={{ padding: '.3rem .75rem', fontSize: '.8rem' }} onClick={() => setPreset('this_year')}>This Year</button>
            <button type="button" className={`nav-btn ${preset==='custom'?'btn-primary':'btn-secondary'}`} style={{ padding: '.3rem .75rem', fontSize: '.8rem' }} onClick={() => setPreset('custom')}>Custom Range</button>
          </div>
          {preset === 'custom' && (
            <div style={{ display: 'flex', gap: '.4rem', alignItems: 'center' }}>
              <input type="date" className="form-control" style={{ padding: '.3rem .5rem', fontSize: '.82rem', width: 'auto' }} value={startDate} onChange={e => setStartDate(e.target.value)} />
              <span style={{ fontSize: '.8rem', color: 'var(--text-muted)' }}>to</span>
              <input type="date" className="form-control" style={{ padding: '.3rem .5rem', fontSize: '.82rem', width: 'auto' }} value={endDate} onChange={e => setEndDate(e.target.value)} />
            </div>
          )}
          <span className="badge badge-purple" style={{ marginLeft: 'auto' }}>
            {subTab === 'local' ? filteredVouchers.length + ' Local Vouchers' : filteredGlobals.length + ' Global Logs'}
          </span>
        </div>

        {subTab === 'local' ? (
          <>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(320px,1fr))', gap: '1.5rem' }}>
              <div><h4 style={{ marginBottom: '.75rem', color: 'var(--primary-amber)', display: 'flex', alignItems: 'center', gap: '.5rem' }}><i className="fa-solid fa-fire"></i> Most Distributed Books</h4><Tbl data={TB} cols={['Rank', 'Book', 'Qty Sold', 'Donation']} /></div>
              <div><h4 style={{ marginBottom: '.75rem', color: 'var(--accent-indigo)', display: 'flex', alignItems: 'center', gap: '.5rem' }}><i className="fa-solid fa-trophy"></i> Devotee Leaderboard</h4><Tbl data={TD} cols={['Rank', 'Devotee', 'Books Sold', 'Collection']} /></div>
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(320px,1fr))', gap: '1.5rem', marginTop: '1.5rem' }}>
              <div><h4 style={{ marginBottom: '.75rem', color: 'var(--accent-blue)', display: 'flex', alignItems: 'center', gap: '.5rem' }}><i className="fa-solid fa-location-dot"></i> Distribution by Location</h4><Tbl2 data={TL} /></div>
              <div><h4 style={{ marginBottom: '.75rem', color: 'var(--accent-emerald)', display: 'flex', alignItems: 'center', gap: '.5rem' }}><i className="fa-solid fa-language"></i> Language-wise Share</h4><Tbl2 data={TG} /></div>

        ) : (
          <div>

            <div className="table-responsive">
              <table className="custom-table">
                <thead><tr><th>Global Rank</th><th>Devotee Name</th><th>Total Books Sold</th><th>Distributed At (Stores)</th></tr></thead>
                <tbody>
                  {URanking.length === 0 ? (
                    <tr><td colSpan="4" style={{ textAlign: 'center', padding: '1.5rem', color: 'var(--text-muted)' }}>No global distribution data for selected period.</td></tr>
