                      <span className="badge badge-emerald"><i className="fa-solid fa-eye"></i> Currently Viewing</span>
                    ) : (
                      <button className="nav-btn btn-secondary" style={{ padding: '.3rem .65rem', fontSize: '.78rem' }} onClick={() => onSwitchWorkspace(u.tenantKey)}>
                        <i className="fa-solid fa-right-to-bracket"></i> Switch to {u.username}'s Store
                      </button>
                    )}
                  </td>
                  <td className="no-print">
                    <button className="nav-btn btn-rose" style={{ padding: '.3rem .65rem', fontSize: '.78rem' }} onClick={() => resetPass(u)}>
                      <i className="fa-solid fa-key"></i> Reset Password
                    </button>
                  </td>
                </tr>
              ))
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────
function App() {
  const [fbCfg, setFbCfg] = useState(getFBConfig);
  const [db, setDb] = useState(null);
  const [loading, setLoading] = useState(true);
  const [fbErr, setFbErr] = useState(null);

  const [creds, setCreds] = useState({username:'folk',password:'admin123',deletePin:'admin123'});
  const [user, setUser] = useState(()=>{try{return JSON.parse(sessionStorage.getItem('folk_session'));}catch{return null;}});
  const [selectedWorkspaceKey, setSelectedWorkspaceKey] = useState(()=>{try{return JSON.parse(sessionStorage.getItem('folk_session'))?.tenantKey||'folk';}catch{return 'folk';}});
  const [allUsers, setAllUsers] = useState([]);

  const [masterBooks, setMasterBooks] = useState(CATALOG);
  const [stock, setStock] = useState([]);
  const [issues, setIssues] = useState([]);
  const [returns, setReturns] = useState([]);
  const [bin, setBin] = useState([]);
  const [devotees, setDevotees] = useState([]);

  const [tab, setTab] = useState('dashboard');
  const [showStock, setShowStock] = useState(false);
  const [showIssue, setShowIssue] = useState(false);
  const [showReturn, setShowReturn] = useState(false);
  const [showCatalog, setShowCatalog] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [printVoucher, setPrintVoucher] = useState(null);
  const [editData, setEditData] = useState(null);

  // Init Firebase
  useEffect(()=>{
    if(!fbCfg){setLoading(false);return;}
    try{
      let app = firebase.apps.length===0 ? firebase.initializeApp(fbCfg) : firebase.apps[0];
      setDb(app.firestore());
    }catch(e){setFbErr('Firebase init failed: '+e.message);setLoading(false);}
  },[fbCfg]);

  // Master Admin: Listen to all registered accounts
  useEffect(()=>{
    if(!db) return;
    return db.collection('users').onSnapshot(s=>{
      setAllUsers(s.docs.map(d=>d.data()));
    });
  },[db]);

  // Helper for multi-tenant collection routing
  const getCol = (colName) => {
    if (!db) return null;
    const k = selectedWorkspaceKey || user?.tenantKey || 'folk';
    if (k === 'folk') return db.collection(colName);
    return db.collection('tenants').doc(k).collection(colName);
  };

  // Firestore listeners (runs on workspace change / user change)
  useEffect(()=>{
    if(!db || !user) return;
    setLoading(true);
    const loaded={}; let cnt=0;
    const mark=(k)=>{if(!loaded[k]){loaded[k]=true;cnt++;if(cnt>=7)setLoading(false);}};
    const err=(e)=>setFbErr('Firestore error: '+e.message+'. Check Firebase Rules (allow read, write: if true).');
    const unsubs=[];
    
    const colSetting = getCol('settings');
    const colStock = getCol('stockVouchers');
    const colIssue = getCol('issueVouchers');
    const colReturn = getCol('returnVouchers');
    const colBin = getCol('recycleBin');
    const colDevotees = getCol('devotees');

    unsubs.push(colSetting.doc('credentials').onSnapshot(d=>{if(d.exists)setCreds(d.data());mark('cr');},err));
    unsubs.push(colSetting.doc('booksCatalog').onSnapshot(d=>{if(d.exists&&d.data()?.books?.length>0)setMasterBooks(d.data().books);else setMasterBooks(CATALOG);mark('bk');},err));
    unsubs.push(colStock.orderBy('createdAt','desc').onSnapshot(s=>{setStock(s.docs.map(d=>({...d.data(),firestoreId:d.id})));mark('st');},err));
    unsubs.push(colIssue.orderBy('createdAt','desc').onSnapshot(s=>{setIssues(s.docs.map(d=>({...d.data(),firestoreId:d.id})));mark('is');},err));
    unsubs.push(colReturn.orderBy('createdAt','desc').onSnapshot(s=>{setReturns(s.docs.map(d=>({...d.data(),firestoreId:d.id})));mark('re');},err));
    unsubs.push(colBin.orderBy('createdAt','desc').onSnapshot(s=>{setBin(s.docs.map(d=>({...d.data(),firestoreId:d.id})));mark('bi');},err));
    unsubs.push(colDevotees.orderBy('createdAt','desc').onSnapshot(s=>{setDevotees(s.docs.map(d=>({...d.data(),firestoreId:d.id})));mark('dv');},err));
    
    return()=>unsubs.forEach(u=>u());
  },[db, user, selectedWorkspaceKey]);

  const TS=()=>firebase.firestore.FieldValue.serverTimestamp();

  // Delete Security Password / PIN check with Retry option (3 attempts)
  const checkDeletePin = () => {
    const expected = creds.deletePin || creds.password || 'admin123';
    let attempts = 0;
    while (attempts < 3) {
      const msg = attempts === 0 
        ? '🔒 SECURITY PIN REQUIRED\n\nEnter Delete Protection Security Password / PIN to confirm deletion:' 
        : `❌ Incorrect Password! (Attempt ${attempts + 1} of 3)\n\nPlease try again or click Cancel:`;
      const input = prompt(msg);
      if (input === null) return false;
      if (input.trim() === expected) return true;
      attempts++;
    }
    alert('❌ Maximum security PIN attempts reached. Deletion cancelled.');
    return false;
  };

  const handleAddStock=async(v)=>{
    if (v.firestoreId) {
      const { firestoreId, ...data } = v;
      await getCol('stockVouchers').doc(firestoreId).update(data);
    } else {
      const { firestoreId, ...data } = v;
      await getCol('stockVouchers').add({...data,createdAt:TS()});
    }
  };
  const handleAddIssue=async(v)=>{
    if (v.firestoreId) {
      const { firestoreId, ...data } = v;
      await getCol('issueVouchers').doc(firestoreId).update(data);
    } else {
      const { firestoreId, ...data } = v;
      await getCol('issueVouchers').add({...data,status:'Active',createdAt:TS()});
    }
  };
  const handleAddReturn=async(v)=>{
    if (v.firestoreId) {
      const { firestoreId, ...data } = v;
      await getCol('returnVouchers').doc(firestoreId).update(data);
    } else {
      const { firestoreId, ...data } = v;
      const batch=db.batch();
      batch.set(getCol('returnVouchers').doc(),{...data,createdAt:TS()});
      const iv=issues.find(x=>x.issueNo===v.issueNo);
      if(iv?.firestoreId)batch.update(getCol('issueVouchers').doc(iv.firestoreId),{status:'Returned'});

      // Add Universal Credits
      if (v.totalSoldQty > 0 && creds.participateLeaderboard !== false) {
        const isGroup = v.devoteeType === 'Group' && v.groupMembers?.length > 0;
        const count = isGroup ? v.groupMembers.length + 1 : 1;
        const splitSold = Math.floor(v.totalSoldQty / count);
        const remainder = v.totalSoldQty % count;

        const addCredit = (devName, amount) => {
          if (amount > 0) {
            batch.set(db.collection('globalCredits').doc(), {
              devoteeName: devName.trim(),
              searchKey: devName.trim().toLowerCase(),
              totalSoldQty: amount,
              storeName: user?.tenantKey || 'folk',
              date: v.returnDate,
              createdAt: TS()
            });
          }
        };

        if (isGroup) {
          addCredit(v.devoteeName, splitSold + remainder); // Leader gets remainder
          v.groupMembers.forEach(m => addCredit(m.name || m, splitSold));
        } else {
          addCredit(v.devoteeName, v.totalSoldQty);
        }
      }
      await batch.commit();
    }
  };

  const handleEditStock = (v) => { if(checkDeletePin()){ setEditData(v); setShowStock(true); } };
  const handleEditIssue = (v) => { if(checkDeletePin()){ setEditData(v); setShowIssue(true); } };
  const handleEditReturn = (v) => { if(checkDeletePin()){ setEditData(v); setShowReturn(true); } };

  const softDel=async(colName,doc,type,voucherNo,details)=>{
    if(!checkDeletePin()) return;
    if(!confirm(`Delete ${type} "${voucherNo}"? It will be moved to the Recycle Bin.`))return;
    const {firestoreId:_,...clean}=doc;
    const batch=db.batch();
    batch.set(getCol('recycleBin').doc(),{type,voucherNo,details,deletedAt:new Date().toLocaleString('en-IN'),deletedBy:user?.username||'Admin',originalData:clean,createdAt:TS()});
    batch.delete(getCol(colName).doc(doc.firestoreId));
    await batch.commit();
  };

  const handleDelStock=(sv)=>softDel('stockVouchers',sv,'Stock Receipt',sv.entryNo,`Store: ${sv.receivedBy} | ${sv.totalQty} Books | ₹${sv.totalAmount}`);
  const handleDelIssue=(iv)=>softDel('issueVouchers',iv,'Issue Voucher',iv.issueNo,`Devotee: ${iv.devoteeName} | ${iv.location} | ${iv.totalIssuedQty} Books`);
  const handleDelReturn=(rv)=>softDel('returnVouchers',rv,'Return Voucher',rv.issueNo,`Devotee: ${rv.devoteeName} | Ret: ${rv.totalReturnedQty} | Sold: ${rv.totalSoldQty} | ₹${rv.totalAmountCollected}`);

  const handleRestore=async(item)=>{
    const{firestoreId:_,...clean}=item.originalData||{};
    const col=item.type==='Stock Receipt'?'stockVouchers':item.type==='Issue Voucher'?'issueVouchers':'returnVouchers';
    const batch=db.batch();
    batch.set(getCol(col).doc(),{...clean,createdAt:TS()});
    batch.delete(getCol('recycleBin').doc(item.firestoreId));
    await batch.commit();
    alert(`Restored "${item.voucherNo}" successfully!`);
  };
  const handlePermDel=async(item)=>{
    if(!checkDeletePin()) return;
    if(confirm(`Permanently delete "${item.voucherNo}"? Cannot be undone.`))await getCol('recycleBin').doc(item.firestoreId).delete();
  };
  const handleClearBin=async()=>{
    if(!checkDeletePin()) return;
    if(confirm('Empty entire Recycle Bin permanently?')){const batch=db.batch();bin.forEach(x=>batch.delete(getCol('recycleBin').doc(x.firestoreId)));await batch.commit();}
  };

  const handleSaveCreds = async (c) => {
    try {
      await getCol('settings').doc('credentials').set(c);
      
      // Universal Leaderboard Opt-out Logic
      if (c.participateLeaderboard === false) {
        const qs = await db.collection('globalCredits').where('storeName', '==', user?.tenantKey || 'folk').get();
        if (!qs.empty) {
          // Process in chunks of 500 to avoid Firestore batch limits
          const chunks = [];
          let currentChunk = db.batch();
          let count = 0;
          
          qs.docs.forEach(d => {
            currentChunk.delete(d.ref);
            count++;
            if (count === 490) {
              chunks.push(currentChunk);
              currentChunk = db.batch();
              count = 0;
            }
          });
          if (count > 0) chunks.push(currentChunk);
          
          for (let batch of chunks) {
            await batch.commit();
          }
        }
      }
      alert('Settings saved to cloud!');
    } catch (err) {
      alert('Error saving settings or removing leaderboard data: ' + err.message);
      console.error(err);
    }
  };
  const handleAddBook=async(b)=>{const upd=[...masterBooks,b];await getCol('settings').doc('booksCatalog').set({books:upd});alert(`"${b.name}" added to catalog!`);};
  const handleResetFB=()=>{if(confirm('Reset Firebase? You will need to re-enter your config.')){localStorage.removeItem('folk_fb_cfg');sessionStorage.removeItem('folk_session');window.location.reload();}};
  const handleLogout=()=>{setUser(null);sessionStorage.removeItem('folk_session');};

  // Screen routing
  if(!fbCfg)return<SetupScreen onSave={c=>{saveFBConfig(c);setFbCfg(c);setLoading(true);}}/>;
  if(!user)return<AuthScreen db={db} onLoginSuccess={u=>{setUser(u);sessionStorage.setItem('folk_session',JSON.stringify(u));setSelectedWorkspaceKey(u.tenantKey);}}/>;
  if(loading)return<LoadingScreen msg={`Loading ${user?.username}'s cloud workspace...`}/>;
  if(fbErr)return<ErrorScreen msg={fbErr} onReset={handleResetFB}/>;

  if (printVoucher) return <PrintView voucher={printVoucher} onClose={() => setPrintVoucher(null)} />;

  return (
    <div className="app-container">
      <Navbar user={user} allUsers={allUsers} selectedWorkspaceKey={selectedWorkspaceKey} onSwitchWorkspace={setSelectedWorkspaceKey} onOpenStock={()=>setShowStock(true)} onOpenIssue={()=>setShowIssue(true)} onOpenReturn={()=>setShowReturn(true)} onOpenCatalog={()=>setShowCatalog(true)} onOpenSettings={()=>setShowSettings(true)} onLogout={handleLogout} />
      <div className="tabs-bar no-print">
        <div className="tabs-container">
          <button className={`tab-item ${tab==='dashboard'?'active':''}`} onClick={()=>setTab('dashboard')}><i className="fa-solid fa-gauge-high"></i> Store Inventory</button>
          <button className={`tab-item ${tab==='stock'?'active':''}`} onClick={()=>setTab('stock')}><i className="fa-solid fa-boxes-stacked"></i> 1. Stock Receipts ({stock.length})</button>
          <button className={`tab-item ${tab==='issues'?'active':''}`} onClick={()=>setTab('issues')}><i className="fa-solid fa-hand-holding-hand"></i> 2. Devotee Issues ({issues.length})</button>
          <button className={`tab-item ${tab==='returns'?'active':''}`} onClick={()=>setTab('returns')}><i className="fa-solid fa-rotate-left"></i> 3. Book Returns ({returns.length})</button>
          <button className={`tab-item ${tab==='devotees'?'active':''}`} onClick={()=>setTab('devotees')}><i className="fa-solid fa-users"></i> 4. Devotees Directory</button>
          <button className={`tab-item ${tab==='analytics'?'active':''}`} onClick={()=>setTab('analytics')}><i className="fa-solid fa-chart-line"></i> 5. Analytics</button>
          <button className={`tab-item ${tab==='bin'?'active':''}`} onClick={()=>setTab('bin')} style={{color:bin.length>0?'var(--accent-rose)':'inherit'}}><i className="fa-solid fa-trash-arrow-up"></i> Recycle Bin ({bin.length})</button>
          {user?.role==='admin'&&<button className={`tab-item ${tab==='admin'?'active':''}`} onClick={()=>setTab('admin')} style={{color:'var(--accent-rose)',fontWeight:700}}><i className="fa-solid fa-user-shield"></i> 🔑 Master Admin Panel ({allUsers.length})</button>}
        </div>
      </div>
      <main className="main-content">
        {tab==='dashboard'&&<Dashboard stockVouchers={stock} issueVouchers={issues} returnVouchers={returns}/>}
        {tab==='stock'&&<StockTable stockVouchers={stock} onOpen={()=>{setEditData(null);setShowStock(true)}} onDelete={handleDelStock} onPrint={setPrintVoucher} onEdit={handleEditStock} />}
        {tab==='issues'&&<IssuesTable issueVouchers={issues} onOpen={()=>{setEditData(null);setShowIssue(true)}} onDelete={handleDelIssue} onPrint={setPrintVoucher} onEdit={handleEditIssue} />}
        {tab==='returns'&&<ReturnsTable returnVouchers={returns} onOpen={()=>{setEditData(null);setShowReturn(true)}} onDelete={handleDelReturn} onPrint={setPrintVoucher} onEdit={handleEditReturn} />}
        {tab==='devotees'&&<DevoteesDirectory devotees={devotees} getCol={getCol} TS={TS} checkDeletePin={checkDeletePin} />}
        {tab==='analytics'&&<Analytics returnVouchers={returns} db={db} creds={creds} user={user} />}
        {tab==='bin'&&<RecycleBin bin={bin} onRestore={handleRestore} onPermDel={handlePermDel} onClear={handleClearBin}/>}
        {tab==='admin'&&user?.role==='admin'&&<MasterAdminPanel allUsers={allUsers} db={db} selectedWorkspaceKey={selectedWorkspaceKey} onSwitchWorkspace={setSelectedWorkspaceKey}/>}
      </main>
      {showStock&&<StockModal isOpen={showStock} onClose={()=>setShowStock(false)} masterBooks={masterBooks} stockVouchers={stock} onAdd={handleAddStock} editData={editData} />}
      {showIssue&&<IssueModal isOpen={showIssue} onClose={()=>setShowIssue(false)} masterBooks={masterBooks} stockVouchers={stock} issueVouchers={issues} returnVouchers={returns} devotees={devotees} onAdd={handleAddIssue} editData={editData} />}
      {showReturn&&<ReturnModal isOpen={showReturn} onClose={()=>setShowReturn(false)} issueVouchers={issues} returnVouchers={returns} onAdd={handleAddReturn} editData={editData} />}
      <CatalogModal isOpen={showCatalog} onClose={()=>setShowCatalog(false)} masterBooks={masterBooks} onAddBook={handleAddBook}/>
      <SettingsModal isOpen={showSettings} onClose={()=>setShowSettings(false)} user={user} creds={creds} onSaveCreds={handleSaveCreds} onResetFB={handleResetFB}/>
      {/* ISKCON Bhadaj Ahmedabad Footer */}
      <footer className="no-print" style={{ marginTop: 'auto', borderTop: '1px solid var(--border-subtle)', background: 'rgba(11,17,30,0.97)', padding: '1rem 1.5rem', textAlign: 'center' }}>
        <div style={{ maxWidth: '1400px', margin: '0 auto', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '.5rem' }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '1.25rem', flexWrap: 'wrap' }}>
            <img src="folk_logo.png" alt="FOLK Life" style={{ width: '36px', height: '36px', borderRadius: '50%', objectFit: 'cover', opacity: 0.85 }} />
            <img src="iskcon_logo.jpg" alt="Srila Prabhupada's ISKCON Bhadaj Ahmedabad" style={{ height: '36px', objectFit: 'contain', opacity: 0.85, borderRadius: '4px' }} />
          </div>
          <p style={{ fontSize: '.72rem', color: 'var(--text-dim)', margin: 0 }}>
            &copy; {new Date().getFullYear()} All rights reserved &nbsp;|&nbsp; ISKCON Bhadaj, Ahmedabad &nbsp;|&nbsp; Managed by FOLK
          </p>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
